---
layout: default
---
<article class="page">
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% include topic-label.html slug=page.topic %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/writing/' | relative_url }}">All writing</a></p>
</article>
