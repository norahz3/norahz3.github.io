---
layout: default
---
<article class="page">
  <p class="meta">
    <span>{{ page.year }}</span>
    {% if page.status %}<span class="status">{{ page.status }}</span>{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  {% if page.link %}<p><a class="button" href="{{ page.link }}">{{ page.link_label | default: "View the project" }}</a></p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/projects/' | relative_url }}">All projects</a></p>
</article>
